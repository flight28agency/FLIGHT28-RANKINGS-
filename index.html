<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Flight28 LIVE Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-one"></div>
  <div class="bg-glow bg-glow-two"></div>

<header class="topbar">
  <a class="brand" href="#">
    <div class="brand-mark">
      <img src="FLIGHT28%20LOGO.png" alt="Flight28 Logo">
    </div>
    <div class="brand-copy">
      <strong>Flight28</strong>
      <small>CREATOR NETWORK</small>
    </div>
  </a>

  <div class="top-actions">
    <span class="status-pill"><span class="dot"></span> Rankings Live</span>
  </div>
</header>

<section class="ranking-main">

  <div class="ranking-tabs" role="tablist">
    <button class="tab active" data-period="daily">🔥 Daily Ranking</button>
    <button class="tab" data-period="weekly">Weekly Ranking</button>
  </div>

  <div class="ranking-reset">

  <div class="reset-time">
    <span id="resetLabel">Next reset:</span>
    <strong id="countdown">00:00:00</strong>
  </div>

  <button id="historyButton" class="history-button">
  🏆 History
</button>

</div>

  <section class="podium" id="podium"></section>

  <section class="leaderboard-card">
    <div id="leaderboardRows"></div>
  </section>

</section>

  </main>

  <template id="rowTemplate">
    <article class="leader-row">
      <div class="rank-cell"></div>
      <div class="creator-cell">
        <div class="avatar-wrap">
          <img class="avatar" alt="" />
          <span class="live-badge">LIVE</span>
        </div>
        <div class="creator-meta">
          <strong class="display-name"></strong>
        </div>
      </div>
      <div class="diamonds-cell">
        <strong class="diamond-value"></strong>
        <span>💎</span>
      </div>
    </article>
  </template>

  <div id="historyModal" class="history-modal">

  <div class="history-box">

    <button id="closeHistory" class="close-history">
      ✕
    </button>

    <h2>
      🏆 Ranking History
    </h2>

    <div id="historyContent">
      Loading...
    </div>

  </div>

</div>


<script src="app.js"></script>
</body>
</html>
